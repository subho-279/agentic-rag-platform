name: agentic-rag

# Development / demo stack. For a real deployment layer docker-compose.prod.yml on top (see DEPLOY.md).

x-python-env: &python-env
  DATABASE_URL: postgresql://rag_app:rag_app_pw@postgres:5432/ragdb
  KAFKA_BOOTSTRAP: kafka:9092
  KAFKA_TOPIC: documents.ingest
  STORAGE_ROOT: /data/uploads
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-hash}
  EMBEDDING_DIM: "1536"
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  LLM_PROVIDER: ${LLM_PROVIDER:-extractive}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
  INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-token-change-me}
  GUARD_BLACKLIST: ${GUARD_BLACKLIST:-}

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ragdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      RAG_APP_PASSWORD: ${RAG_APP_PASSWORD:-rag_app_pw}
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./db/02-app-password.sh:/docker-entrypoint-initdb.d/02-app-password.sh:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ragdb"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.8.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  gateway:
    build: ./gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ragdb
      DB_USER: rag_app
      DB_PASSWORD: ${RAG_APP_PASSWORD:-rag_app_pw}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      KAFKA_BOOTSTRAP: kafka:9092
      AGENT_URL: http://agent:8000
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-token-change-me}
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-at-least-32-bytes-long!!}
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:-}
      DEV_TOKENS_ENABLED: ${DEV_TOKENS_ENABLED:-true}
      STORAGE_ROOT: /data/uploads
      RATE_LIMIT_CAPACITY: ${RATE_LIMIT_CAPACITY:-20}
      RATE_LIMIT_REFILL_PER_SEC: ${RATE_LIMIT_REFILL_PER_SEC:-5}
    volumes:
      - uploads:/data/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}
      agent: {condition: service_healthy}

  agent:
    build: ./python
    restart: unless-stopped
    command: ["uvicorn", "ragplatform.agent.app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: *python-env
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets the agent reach Ollama on the host (needed on Linux)
    # No published port: the agent is only reachable through the gateway.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    depends_on:
      postgres: {condition: service_healthy}

  worker:
    build: ./python
    restart: unless-stopped
    command: ["python", "-m", "ragplatform.worker.main"]
    environment: *python-env
    volumes:
      - uploads:/data/uploads:ro
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}

volumes:
  pgdata:
  kafkadata:
  uploads:
