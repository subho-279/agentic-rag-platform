name: CI

on:
  push:
  pull_request:

jobs:
  python:
    # Full Python suite against a REAL Postgres (pgvector + RLS) and Redis: unit, graph, worker loop,
    # RLS isolation, ingestion pipeline, token-bucket Lua script, and scripts/demo.py end to end.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ragdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d ragdb"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.2-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Apply schema
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d ragdb -v ON_ERROR_STOP=1 -f db/init.sql
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: pip install -e 'python[dev]' httpx
      - name: Tests
        working-directory: python
        env:
          RAG_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ragdb
          RAG_TEST_REDIS_URL: redis://localhost:6379/0
        run: pytest -q -rs

  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B verify

  compose-config:
    # Dev and prod overlays must render; the prod overlay must refuse to start without secrets.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - name: Prod overlay renders with secrets
        run: |
          cat > prod.env <<'EOF'
          DOMAIN=rag.example.com
          POSTGRES_PASSWORD=a
          RAG_APP_PASSWORD=b
          REDIS_PASSWORD=c
          INTERNAL_TOKEN=d
          JWT_SECRET=0123456789abcdef0123456789abcdef0123
          EOF
          docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file prod.env config --quiet
      - name: Prod overlay refuses to render without secrets
        run: |
          if docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet 2>/dev/null; then
            echo "prod overlay rendered without secrets"; exit 1
          fi

  e2e:
    # The real thing: build every image, start Postgres/Redis/Kafka/gateway/agent/worker, run the demo.
    runs-on: ubuntu-latest
    needs: [python, gateway]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose up --build -d --wait --wait-timeout 420
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - name: Run the demo
        run: python scripts/demo.py
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Tear down
        if: always()
        run: docker compose down -v
